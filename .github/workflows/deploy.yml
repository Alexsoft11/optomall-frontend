name: Deploy to VDS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to VDS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VDS_USERNAME }}@${{ secrets.VDS_HOST }} 'bash /home/alexsoft1/onway/deploy.sh'

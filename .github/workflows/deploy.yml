name: Deploy to VDS

on:
  push:
    branches: [ server ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18.x'
        
    - name: Build
      run: npm run build
      
    - name: Install
      run: npm install --force
      
    - name: Deploy to VDS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VDS_HOST }}
        username: ${{ secrets.VDS_USERNAME }}
        key: ${{ secrets.VDS_SSH_KEY }}
        source: ".next,package.json,package-lock.json,public"
        target: "/home/alexsoft1/onway"
    
    - name: Restart PM2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VDS_HOST }}
        username: ${{ secrets.VDS_USERNAME }}
        key: ${{ secrets.VDS_SSH_KEY }}
        script: |
          cd /home/alexsoft1/onway/
          pm2 restart onway

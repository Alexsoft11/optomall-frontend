name: Deploy to VDS

on:
  push:
    branches: [server]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VDS_SSH_KEY }}

      - name: Deploy to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USERNAME: ${{ secrets.VDS_USERNAME }}
        run: |
          ssh $VDS_USERNAME@$VDS_HOST 'bash /home/alexsoft1/onway/deploy.sh'

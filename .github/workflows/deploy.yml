name: Deploy to VDS

on:
  push:
    branches:
      - server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up SSH Agent and add SSH Key for secure server connection
      # - name: Set up SSH Agent and Add SSH Key
      #   uses: webfactory/ssh-agent@v0.5.3
      #   with:
      #     ssh-private-key: ${{ secrets.VDS_SSH_KEY  }}

      # Step 3: Deploy to server by running a remote script
      - name: Deploy to Server
        env:
          # Pass environment secrets securely, such as SSH user and server IP
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no $VDS_USER@$VDS_HOST 'bash /home/alexsoft1/onway/deploy.sh'

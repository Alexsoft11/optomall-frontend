name: Deploy to VDS

on:
  push:
    branches: [server]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v2

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      # Install dependencies
      - name: Install dependencies
        run: npm install --production --force

      # Build the project
      - name: Build
        run: npm run build

      # Deploy files to VDS
      - name: Deploy to VDS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: |
            .next
            package.json
            package-lock.json
            public
          target: "/home/alexsoft1/onway"

      # Restart PM2
      - name: Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            pm2 restart front 
